#|
Laboratory experiment configuration.
Scientific measurements and nested settings.
|#

global repeats = 3e+0;

global defaults = @{
    warmup = 1.5e+1;
    range = @{
        low = -2.5e-1;
        high = 1.0e+2;
    };
};

@{
    experiment = @{
        settings = ^[defaults];
        repeats = ^[repeats];

        sensor = @{
            gain = 2.5e-3;
            offset = -5e-2;
        };
    };
}
