#|
Network equipment configuration.
Example of constants and nested dictionaries.
|#

global mainport = 8e+3;
global retries = 3e+0;

global thresholds = @{
    minimum = -1.25e+1;
    maximum = 4e+2;
};

@{
    router = @{
        interface = @{
            port = ^[mainport];
            retries = ^[retries];
        };
        limits = ^[thresholds];
    };

    backup = @{
        port = ^[mainport];
    };
}
